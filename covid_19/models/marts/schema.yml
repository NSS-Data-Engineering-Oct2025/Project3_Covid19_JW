version: 2

models:
  - name: mart_rolling_avg_cases
    description: "3-month rolling average of new cases by state (monthly CDC data)"
    columns:
      - name: state_fips
        description: "2-digit state FIPS code"
        tests:
          - not_null
      - name: case_month
        tests:
          - not_null
      - name: monthly_cases
        tests:
          - not_null
      - name: rolling_3mo_avg_cases
        tests:
          - not_null

  - name: mart_case_fatality_rate
    description: "Case fatality rate (deaths / cases) by state and month"
    columns:
      - name: state_fips
        tests:
          - not_null
      - name: case_month
        tests:
          - not_null
      - name: case_fatality_rate_pct
        description: "Percentage — expect values between 0 and 100"
        tests:
          - not_null

  - name: mart_cases_per_100k
    description: "Population-normalized case rate by county and month"
    columns:
      - name: county_fips
        tests:
          - not_null
      - name: case_month
        tests:
          - not_null
      - name: cases_per_100k
        tests:
          - not_null

  - name: mart_vaccination_vs_cases
    description: "Vaccination coverage vs cumulative case rate by county"
    columns:
      - name: county_fips
        tests:
          - not_null
          - unique:
              config:
                severity: warn

  - name: mart_hospitalization_rate
    description: >
      Custom metric: percentage of confirmed cases that required hospitalization,
      by state and month. Signals healthcare system burden independent of fatality rate.
    columns:
      - name: state_fips
        tests:
          - not_null
      - name: case_month
        tests:
          - not_null
      - name: total_cases
        tests:
          - not_null
      - name: hospitalization_rate_pct
        description: "Expect values between 0 and 100"
        tests:
          - not_null

  - name: mart_severity_index
    description: >
      Custom metric: composite severity score per county combining hospitalization rate (40%),
      ICU rate (40%), and case fatality rate (20%). Ranks counties by overall disease severity
      to support resource allocation decisions.
    columns:
      - name: county_fips
        tests:
          - not_null
          - unique
      - name: severity_index
        tests:
          - not_null

  - name: mart_data_freshness
    description: "Pipeline health — when each source was last loaded"
    columns:
      - name: source_table
        tests:
          - not_null
          - unique
      - name: freshness_status
        tests:
          - not_null
          - accepted_values:
              values: ["Fresh", "Recent", "Stale", "Very Stale"]
