[project]
name = "project3-covid19"
version = "0.1.0"
description = "COVID-19 Data Intelligence Platform — CDC + Census → Snowflake → dbt → Streamlit"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "httpx>=0.27",
    "pandas>=2.2",
    "snowflake-connector-python>=3.10",
    "python-dotenv>=1.0",
    "loguru>=0.7",
    "dbt-snowflake>=1.8",
    "apache-airflow>=2.9",
    "streamlit>=1.35",
    "plotly>=5.22",
    "tabulate>=0.10.0",
    "pyyaml>=6.0.3",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"
